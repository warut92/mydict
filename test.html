<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="style.css">
  <title>Online Dictionary</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Enable dark mode using media query
    tailwind.config = {
      darkMode: 'media', // Use 'media' or 'class'
    };
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-xl bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800 dark:text-gray-100">
      📖 Thai - English Online Dictionary
    </h1>
    
    <input 
      type="text" 
      id="searchInput" 
      placeholder="Search for a word..." 
      class="w-full px-4 py-2 border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 mb-4"
      oninput="liveSearch(this.value)" 
      onfocus="liveSearch(this.value)"
    />

    <div id="liveSearch"></div>
    <div id="countWordResult"></div>
    
    <div id="searchResult"></div>
    
    <div id="e"></div>
  </div>

  <script src="data.js" charset="utf-8"></script>
  <script src="thaiData.js" charset="utf-8"></script>
  <script src="espdic.js" charset="utf-8"></script>
  <script src="app.js" charset="utf-8"></script>
</body>
</html>
